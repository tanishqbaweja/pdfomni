        }
        var initialTheme = null;
        try {
          if (window.parent !== window) {
            initialTheme = window.parent.document.documentElement.dataset.theme;
          }
        } catch (_) {}

          try {
            initialTheme = localStorage.getItem('pdfomni_theme');

        window.addEventListener('message', function (event) {
          if (event.origin !== window.location.origin || !event.data || event.data.type !== 'pdfomni-theme') return;
          apply(event.data.theme);
        });
      })();
